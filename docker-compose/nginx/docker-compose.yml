services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: "always"
    command: tunnel --no-autoupdate run --token $TUNNEL_TOKEN

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: "always"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - /data/compose/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /data/compose/nginx/certs:/etc/letsencrypt
